# n8n for the demo flow (stand-in for Power Automate). Start: docker compose up -d   UI: http://localhost:5678
# The Python services run on the host (python -m bc_sim.server --host 0.0.0.0, python -m invoice_engine.service
# --host 0.0.0.0); n8n reaches them at host.docker.internal.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: newworks_n8n
    ports:
      - "127.0.0.1:5678:5678"          # only reachable from this machine
    environment:
      - GENERIC_TIMEZONE=Europe/Copenhagen
      - TZ=Europe/Copenhagen
      - N8N_SECURE_COOKIE=false
      # Nothing leaves the machine: no telemetry, no version checks, no templates from n8n's servers.
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - newworks_n8n_data:/home/node/.n8n
      - ./n8n:/files
volumes:
  newworks_n8n_data:
